            idle-timeout 10;
            permissions all;
        }
        user netadmin {
            uid 2001;
            class ops;
            authentication {
                encrypted-password "$6$FAKESALT$FAKEHASHFAKEHASHFAKEHASHFAKEHASHFAKEHASHFAKEHASHFAKEHASH"; ## SECRET-DATA
            }
        }
    }
