    filter PROTECT-RE {
        term ALLOW-SSH {
            from {
                source-address {
                    10.0.0.0/24;
                }
                protocol tcp;
                destination-port ssh;
            }
            then accept;
        }
        term DENY-ALL {
            then discard;
        }
