!
! SAMPLE DATA - synthetic configuration for development and demonstration only.
! Hardened example. Not taken from a real device. All secrets are fake.
!
version 17.6
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname CORE-RTR-01
!
enable secret 9 $9$FAKEsaltFAKEsalt$FAKEhashFAKEhashFAKEhashFAKEhashFAKEhash00
!
username netadmin privilege 15 secret 9 $9$FAKEsaltFAKEsalt$FAKEhashFAKEhashFAKEhashFAKEhashFAKEhash11
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa session-id common
!
ip ssh version 2
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
login block-for 120 attempts 3 within 60
security passwords min-length 10
!
no ip http server
ip http secure-server
!
ip access-list standard MGMT-ACL
 permit 10.0.0.0 0.0.0.255
 deny   any log
!
snmp-server group NMS v3 priv
snmp-server user nmsuser NMS v3 auth sha FakeAuthPass123 priv aes 128 FakePrivPass123
snmp-server host 10.0.0.50 version 3 priv nmsuser
!
logging host 10.0.0.60
logging buffered 32768
!
ntp authenticate
ntp authentication-key 1 md5 FakeNtpKey123
ntp trusted-key 1
ntp server 10.0.0.70 key 1
!
line con 0
 exec-timeout 5 0
 logging synchronous
line vty 0 15
 access-class MGMT-ACL in
 exec-timeout 10 0
 transport input ssh
!
end
